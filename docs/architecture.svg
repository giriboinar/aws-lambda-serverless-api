<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" font-family="sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#555"/>
    </marker>
  </defs>
  <text x="380" y="28" text-anchor="middle" font-size="18" font-weight="bold">aws-lambda-serverless-api — architecture</text>

  <rect x="20" y="90" width="130" height="80" rx="8" fill="#e8f0fe" stroke="#1a73e8"/>
  <text x="85" y="122" text-anchor="middle" font-size="14" font-weight="bold">Client</text>
  <text x="85" y="142" text-anchor="middle" font-size="12">HTTPS</text>

  <rect x="200" y="90" width="150" height="80" rx="8" fill="#fef7e0" stroke="#f9ab00"/>
  <text x="275" y="115" text-anchor="middle" font-size="14" font-weight="bold">API Gateway</text>
  <text x="275" y="135" text-anchor="middle" font-size="12">HTTP API</text>
  <text x="275" y="152" text-anchor="middle" font-size="12">$default stage</text>

  <rect x="400" y="90" width="150" height="80" rx="8" fill="#e6f4ea" stroke="#188038"/>
  <text x="475" y="115" text-anchor="middle" font-size="14" font-weight="bold">Lambda</text>
  <text x="475" y="135" text-anchor="middle" font-size="12">Python 3.12</text>
  <text x="475" y="152" text-anchor="middle" font-size="12">128 MB · 30 s</text>

  <rect x="600" y="90" width="140" height="80" rx="8" fill="#f3e8fd" stroke="#9334e6"/>
  <text x="670" y="115" text-anchor="middle" font-size="14" font-weight="bold">DynamoDB</text>
  <text x="670" y="135" text-anchor="middle" font-size="12">tasks table</text>
  <text x="670" y="152" text-anchor="middle" font-size="12">on-demand</text>

  <rect x="400" y="210" width="150" height="60" rx="8" fill="#fce8e6" stroke="#d93025"/>
  <text x="475" y="232" text-anchor="middle" font-size="14" font-weight="bold">CloudWatch</text>
  <text x="475" y="250" text-anchor="middle" font-size="12">Logs · 14-day retention</text>

  <line x1="150" y1="130" x2="198" y2="130" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="350" y1="130" x2="398" y2="130" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="550" y1="130" x2="598" y2="130" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="475" y1="170" x2="475" y2="208" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="380" y="292" text-anchor="middle" font-size="11" fill="#666">Terraform provisions everything · IAM role: least privilege (logs + DynamoDB CRUD on this table only)</text>
